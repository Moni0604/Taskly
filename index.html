
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly - Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>Taskly</h2>
        <p>Manage your work. Achieve your goals.</p>
    </header>

    <main>
        <section class="welcome">
            <h1>Welcome to Taskly!</h1>
            <p>Your personal task management dashboard.</p>
        </section>

        <section class="stats">
            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>
            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>
        </section>

        <section class="task-section">
            <h2>My Tasks</h2>
            <input type="text" id="taskInput" placeholder="Enter a new task">
            <button id="addTaskBtn">Add Task</button>
            <ul id="taskList"></ul>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
